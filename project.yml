name: DevDock
options:
  bundleIdPrefix: com.devdock
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

packages:
  # Auto-update for a directly-distributed (non-App-Store) app. Fetched over the
  # network on first build — `xcodegen generate` records the reference; `xcodebuild`
  # resolves it. Pinned to the 2.9.x line.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_WARN_UNUSED_VARIABLE: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: NO

targets:
  DevDock:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevDock
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devdock.DevDock
        PRODUCT_NAME: DevDock
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DevDock/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DevDock/Resources/DevDock.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DevDockTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: DevDockTests
    dependencies:
      - target: DevDock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devdock.DevDockTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DevDock:
    build:
      targets:
        DevDock: all
        DevDockTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DevDockTests
    profile:
      config: Release
    archive:
      config: Release
