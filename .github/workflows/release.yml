name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # XcodeGen emits a modern project format (objectVersion 77) that needs
      # Xcode 16+; the runner defaults to an older Xcode, so pick the newest one.
      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Package DMG
        run: scripts/package-dmg.sh

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Idempotent: create the release if the tag was pushed on its own,
          # or attach to one already cut manually. --clobber replaces a re-run's asset.
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "DevDock ${TAG#v}"
          gh release upload "$TAG" DevDock-*.dmg --clobber
