name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # XcodeGen emits a modern project format (objectVersion 77) that needs
      # Xcode 16+; the runner defaults to an older Xcode, so pick the newest one.
      - name: Select latest stable Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/dd/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild \
            -project DevDock.xcodeproj \
            -scheme DevDock \
            -destination 'platform=macOS' \
            -derivedDataPath build/dd \
            test
